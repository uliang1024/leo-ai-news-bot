name: Run AI News Bot

on:
  schedule:
    - cron: '0 */4 * * *' # 每 4 小時在雲端自動執行一次
  workflow_dispatch: # 支援在 GitHub 網頁手動點擊執行

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 賦予 GitHub Actions 寫入與提交 history.json 的權限

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install feedparser requests google-genai

      - name: Execute script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py

      - name: Commit history.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --staged --quiet || (git commit -m "Update history.json [skip ci]" && git push)
